<style>
:root{
  --teal:#21747a; --teal-bright:#2aa39a; --teal-deep:#15545a;
  --ink:#15211d; --ink-2:#46554f; --ink-3:#6c7d76;
  --surface:#fff; --surface-2:#f5f9f8; --line:rgba(21,33,29,.09);
  --gradient:linear-gradient(135deg,#2aa39a,#21747a);
  --radius:20px; --pill:99px;
  --shadow:0 1px 2px rgba(15,30,26,.04), 0 12px 30px -16px rgba(15,30,26,.18);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--surface-2);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:40px 24px 64px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--teal);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:28px;transition:gap .2s}
.back:hover{gap:12px}
.head{text-align:center;margin-bottom:28px}
.head img{height:46px;margin-bottom:18px}
.head h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.02em}
.head p{color:var(--ink-2);margin-top:8px;font-size:16px}
.toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--pill);padding:5px;margin:22px auto 0;box-shadow:var(--shadow)}
.toggle button{border:0;background:none;cursor:pointer;font:inherit;font-weight:700;
  color:var(--ink-2);padding:10px 22px;border-radius:var(--pill);transition:all .2s var(--ease)}
.toggle button.on{background:var(--gradient);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:34px}
@media(max-width:880px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);
  border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;
  box-shadow:0 4px 24px rgba(21,33,29,.06);
  transition:transform .3s var(--ease), box-shadow .3s, border-color .3s;}
@keyframes iridescent{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#2aa39a,#21747a,#2aa39a,#21747a);background-size:200% 200%;
  animation:iridescent 10s ease infinite;
  color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;
  padding:5px 16px;border-radius:var(--pill);text-transform:uppercase;white-space:nowrap;
  box-shadow:0 4px 12px rgba(42,163,154,.4);}
.badge-gold{background:linear-gradient(135deg,#e0b34a,#e0b34a,#d4a840,#e0b34a)!important;background-size:200% 200%!important;animation:iridescent 10s ease infinite!important;box-shadow:0 4px 12px rgba(224,179,74,.45)!important;color:#fff!important;}
.name{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--teal);text-transform:uppercase;text-align:center;margin-bottom:4px;}
.per{margin:14px 0 6px;text-align:center;}
.per b{font-size:38px;letter-spacing:-.03em;}.per span{color:var(--ink-3);font-size:15px;margin-left:4px;}
.per-wrap{display:flex;flex-direction:column;align-items:center;}
.feats{list-style:none;margin:18px 0 14px;flex:1;display:flex;flex-direction:column;gap:10px}
.feats li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink-2);line-height:1.5;}
.feats .ck{width:20px;height:20px;flex:none;border-radius:50%;background:linear-gradient(135deg,#2aa39a,#21747a);color:#fff;display:grid;place-items:center;margin-top:1px;}
.feats .ck svg{width:11px;height:11px}

.savings{display:inline-block;background:linear-gradient(135deg,#2aa39a,#21747a,#2aa39a,#21747a);background-size:200% 200%;animation:iridescent 12s ease infinite;color:#fff;
  font-size:11px;font-weight:800;padding:4px 14px;border-radius:99px;
  margin:4px 0 8px;white-space:nowrap;box-shadow:0 3px 10px rgba(42,163,154,.3);}
.total{display:flex;justify-content:center;align-items:baseline;padding-top:14px;border-top:1px solid var(--line);margin-top:auto;}
.total .lbl{font-size:18px;color:var(--ink);font-weight:800;text-align:center;}
.pay{margin-top:16px;display:block;text-align:center;text-decoration:none;
  background:linear-gradient(135deg,#2aa39a,#21747a,#2aa39a,#21747a);background-size:200% 200%;
  animation:iridescent 12s ease infinite;
  color:#fff;font-weight:800;font-size:16px;
  padding:15px;border-radius:var(--pill);
  box-shadow:0 4px 16px rgba(42,163,154,.3);
  transition:transform .2s var(--ease),box-shadow .2s;
  letter-spacing:.02em;}
.pay:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(42,163,154,.5);}
.note{text-align:center;color:var(--ink-3);font-size:13px;margin-top:26px}
</style>

<body>
<div class="wrap">
  <a href="index.html" class="back">← Back to site</a>

  <div class="head">
    <a href="index.html" class="logo-link" style="display:inline-block;line-height:0"><img src="../assets/logo-clean.png" alt="DoubleLang"></a>
    <h1>English Language</h1>
    <p style="font-weight:700;font-size:20px;text-align:center;color:var(--ink-2);margin-top:8px">Choose the right plan</p>
    <div class="toggle">
      <button id="t-ru" class="on" onclick="setTeacher('ru')">Russian-speaking teacher</button>
      <button id="t-native" onclick="setTeacher('native')">Native speaker</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>


</div>

<script>
const PLANS = {
  ru: [
    {name:'START',      lessons:5,  total:105, per:21, popular:false},
    {name:'BASIS',      lessons:10, total:190, per:19, popular:true,  savings:20},
    {name:'BREAKTHROUGH', lessons:20, total:340, per:17, popular:false, savings:80},
    {name:'MASTERY', lessons:30, total:420, per:14, popular:false, superBadge:true, savings:210},
  ],
  native: [
    {name:'START',      lessons:5,  total:175, per:35, popular:false},
    {name:'BASIS',      lessons:10, total:320, per:32, popular:true,  savings:30},
    {name:'BREAKTHROUGH', lessons:20, total:580, per:29, popular:false, savings:120},
    {name:'MASTERY', lessons:30, total:780, per:26, popular:false, superBadge:true, savings:270},
  ],
};

const LINKS = {
  ru: {
    'START':      'https://app.lava.top/products/874a3483-c28e-4489-9047-f00c82d1225c/299c1c26-b5ab-41d1-8b6b-ca2ec9f5417f?currency=EUR',
    'BASIS':      'https://app.lava.top/products/874a3483-c28e-4489-9047-f00c82d1225c/e070a4e8-12af-45a4-bb30-a4956be254a0?currency=EUR',
    'BREAKTHROUGH':     'https://app.lava.top/products/874a3483-c28e-4489-9047-f00c82d1225c/b413b8c8-813d-44af-9c48-7d4516088539?currency=EUR',
    'MASTERY': 'https://app.lava.top/products/874a3483-c28e-4489-9047-f00c82d1225c/03583b9d-72d9-44c4-ac3a-3d46509ce4db?currency=EUR',
  },
  native: {
    'START':      'https://app.lava.top/products/1e11ad37-2bd1-4e09-9425-1e99dbaf7e06/ca792ef1-7192-4852-9100-5dd06026f75f?currency=EUR',
    'BASIS':      'https://app.lava.top/products/1e11ad37-2bd1-4e09-9425-1e99dbaf7e06/f1a105e3-889b-4dc9-bdee-320b701252e5?currency=EUR',
    'BREAKTHROUGH':     'https://app.lava.top/products/1e11ad37-2bd1-4e09-9425-1e99dbaf7e06/89c5e587-e47a-4bbd-98ed-7c98ffcd692b?currency=EUR',
    'MASTERY': 'https://app.lava.top/products/1e11ad37-2bd1-4e09-9425-1e99dbaf7e06/b4fe71c8-f087-4f81-affd-8f528c24764a?currency=EUR',
  },
};

let teacher = 'ru';
const CK = '<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4 4L19 7"/></svg></span>';

function render(){
  document.getElementById('grid').innerHTML = PLANS[teacher].map(p=>{
    const feats = [
      p.lessons === 5  ? 'Get acquainted with the format' :
      p.lessons === 10 ? 'Feel real progress' :
      p.lessons === 20 ? 'Move up to a new level' :
                         'Full immersion in the language',
      p.lessons === 5  ? 'Perfect for starting out' :
      p.lessons === 10 ? 'Build your language base' :
      p.lessons === 20 ? '' :
                         'Ready for exams and life',
      p.lessons === 5  ? '' :
      p.lessons === 10 ? 'First confident conversations' :
      p.lessons === 20 ? 'Noticeable results' :
                         'Priority scheduling',
    ].filter(Boolean);
    return `<div class="card${p.popular?' featured':''}">
      ${p.popular?'<span class="badge">Popular</span>':p.superBadge?'<span class="badge badge-gold">Best value</span>':''}
      <div class="name">${p.name}</div>
      <div class="per-wrap"><div class="per"><b>${p.per} €</b> <span>/ lesson</span></div>${p.savings?'<span class="savings">Save '+p.savings+' €</span>':'<span class="savings" style="visibility:hidden">Save</span>'}</div>
      <ul class="feats">${feats.map(f=>`<li>${CK}${f}</li>`).join('')}</ul>
      <div class="total"><span class="lbl">${p.lessons} lessons</span></div>
      <a class="pay" href="${LINKS[teacher][p.name]}">Pay ${p.total} €</a>
    </div>`;
  }).join('');
}
function setTeacher(t){
  teacher = t;
  document.getElementById('t-ru').classList.toggle('on', t==='ru');
  document.getElementById('t-native').classList.toggle('on', t==='native');
  render();
}
render();
(function(){
  var p = new URLSearchParams(window.location.search).get('type');
  if(p === 'native') setTeacher('native');
  else setTeacher('ru');
})();
</script>

<div id="dl-cookie-banner" style="position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;max-width:760px;margin:0 auto;background:#15211d;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:18px 20px;display:none;font-family:'Manrope',system-ui,-apple-system,sans-serif">
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between">
    <p style="margin:0;font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.82);flex:1 1 320px">We use cookies and analytics services (Google, Yandex, Meta) for the site to work properly and improve your experience. By continuing to use the site, you agree to our <a href="privacy.html" style="color:#e0b34a;text-decoration:underline">privacy policy</a>.</p>
    <button id="dl-cookie-ok" style="flex:0 0 auto;background:linear-gradient(135deg,#2aa39a,#21747a);color:#fff;border:none;border-radius:99px;padding:12px 28px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">Accept</button>
  </div>
</div>
<script>(function(){try{var K='dl_cookie_consent';var b=document.getElementById('dl-cookie-banner');if(!b)return;if(localStorage.getItem(K)==='1'){b.remove();return;}b.style.display='block';document.getElementById('dl-cookie-ok').addEventListener('click',function(){try{localStorage.setItem(K,'1');}catch(e){}b.remove();});}catch(e){}})();</script>

</body>
</html>
