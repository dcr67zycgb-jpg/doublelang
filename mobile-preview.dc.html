<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin:0; background:#1a1a2e; display:flex; justify-content:center; align-items:flex-start; padding:40px 20px; min-height:100vh; }
.phone-wrap { position:relative; width:390px; flex-shrink:0; }
.phone-frame { position:relative; width:390px; background:#111; border-radius:55px; padding:12px; box-shadow:0 0 0 2px #333, 0 40px 80px rgba(0,0,0,.6); }
.phone-screen { border-radius:44px; overflow:hidden; height:844px; position:relative; background:#000; }
.phone-screen iframe { width:390px; height:844px; border:none; transform-origin:top left; }
.notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:34px; background:#111; border-radius:0 0 20px 20px; z-index:10; }
.home-bar { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(255,255,255,.3); border-radius:3px; }
.side-btn { position:absolute; background:#222; border-radius:3px; }
.vol-up { left:-14px; top:120px; width:4px; height:32px; }
.vol-dn { left:-14px; top:160px; width:4px; height:32px; }
.pwr { right:-14px; top:140px; width:4px; height:60px; }
.label { text-align:center; color:#666; font:12px/1 system-ui; margin-top:16px; }
</style>
</helmet>

<div class="phone-wrap">
  <div class="phone-frame">
    <div class="side-btn vol-up"></div>
    <div class="side-btn vol-dn"></div>
    <div class="side-btn pwr"></div>
    <div class="phone-screen">
      <div class="notch"></div>
      <iframe src="german/index.html" title="German mobile preview"></iframe>
      <div class="home-bar"></div>
    </div>
  </div>
  <div class="label">German — mobile 390px</div>
</div>
</x-dc>

<div id="dl-cookie-banner" style="position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;max-width:760px;margin:0 auto;background:#15211d;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:18px 20px;display:none;font-family:'Manrope',system-ui,-apple-system,sans-serif">
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between">
    <p style="margin:0;font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.82);flex:1 1 320px">Мы используем файлы cookie и сервисы аналитики (Google, Yandex, Meta) для корректной работы сайта и улучшения его удобства. Продолжая пользоваться сайтом, вы соглашаетесь с <a href="/dutch/privacy.html" style="color:#e0b34a;text-decoration:underline">политикой конфиденциальности</a>.</p>
    <button id="dl-cookie-ok" style="flex:0 0 auto;background:linear-gradient(135deg,#2aa39a,#21747a);color:#fff;border:none;border-radius:99px;padding:12px 28px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">Принять</button>
  </div>
</div>
<script>(function(){try{var K='dl_cookie_consent';var b=document.getElementById('dl-cookie-banner');if(!b)return;if(localStorage.getItem(K)==='1'){b.remove();return;}b.style.display='block';document.getElementById('dl-cookie-ok').addEventListener('click',function(){try{localStorage.setItem(K,'1');}catch(e){}b.remove();});}catch(e){}})();</script>

</body>
</html>
