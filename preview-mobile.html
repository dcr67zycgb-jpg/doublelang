<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мобильный просмотр</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#3a3f45,#1a1c1f);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  .bar{display:flex;gap:10px;align-items:center;color:#cfd3d8;font-size:13px}
  .bar select{background:#2a2d31;color:#fff;border:1px solid #444;border-radius:8px;padding:6px 10px;font-size:13px}
  .phone{width:390px;height:812px;border:13px solid #0b0c0d;border-radius:52px;
    box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 0 0 2px #33363a;background:#0b0c0d;position:relative;overflow:hidden}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;
    background:#0b0c0d;border-radius:0 0 18px 18px;z-index:5}
  iframe{width:390px;height:812px;border:0;display:block}
</style></head>
<body>
  <div class="bar">
    <span>Мобильный просмотр (390 × 812)</span>
    <select id="pick" onchange="document.getElementById('fr').src=this.value">
      <option value="index.html">Home</option>
      <option value="english/index.html">Английский</option>
      <option value="german/index.html">Немецкий</option>
      <option value="serbian/index.html">Сербский</option>
      <option value="dutch/index.html">Нидерландский</option>
      <option value="french/index.html">Французский</option>
    </select>
  </div>
  <div class="phone"><div class="notch"></div><iframe id="fr" src="index.html"></iframe></div>

<div id="dl-cookie-banner" style="position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;max-width:760px;margin:0 auto;background:#15211d;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:18px 20px;display:none;font-family:'Manrope',system-ui,-apple-system,sans-serif">
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between">
    <p style="margin:0;font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.82);flex:1 1 320px">Мы используем файлы cookie и сервисы аналитики (Google, Yandex, Meta) для корректной работы сайта и улучшения его удобства. Продолжая пользоваться сайтом, вы соглашаетесь с <a href="/dutch/privacy.html" style="color:#e0b34a;text-decoration:underline">политикой конфиденциальности</a>.</p>
    <button id="dl-cookie-ok" style="flex:0 0 auto;background:linear-gradient(135deg,#2aa39a,#21747a);color:#fff;border:none;border-radius:99px;padding:12px 28px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">Принять</button>
  </div>
</div>
<script>(function(){try{var K='dl_cookie_consent';var b=document.getElementById('dl-cookie-banner');if(!b)return;if(localStorage.getItem(K)==='1'){b.remove();return;}b.style.display='block';document.getElementById('dl-cookie-ok').addEventListener('click',function(){try{localStorage.setItem(K,'1');}catch(e){}b.remove();});}catch(e){}})();</script>

</body></html>
